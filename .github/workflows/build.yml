name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use latest theme
        # Ignore the committed theme pin and build with the theme's current master.
        run: |
          npx gulp themeBump
          echo "Theme: $(node -p "require('./package.json').dependencies['hexo-theme-cactus']")" >> "$GITHUB_STEP_SUMMARY"

      - name: Build site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Check output
        run: test -s public/index.html
