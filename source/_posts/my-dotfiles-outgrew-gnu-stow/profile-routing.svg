<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Chezmoi profile routing</title>
  <desc id="desc">Operating-system detection selects exactly one of the darwin, linux-arch, or windows profiles and rejects unsupported systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111b"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6c7086"/></marker>
    <style>
      text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cdd6f4}
      .title{font-size:52px;font-weight:750}.subtitle{font-size:23px;fill:#a6adc8}.label{font-size:24px;font-weight:650}.small{font-size:19px;fill:#a6adc8}.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:21px}
      .card{fill:#1e1e2e;stroke:#45475a;stroke-width:2}.line{fill:none;stroke:#6c7086;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="840" rx="36" fill="url(#bg)"/>
  <circle cx="1420" cy="100" r="190" fill="#cba6f7" opacity=".06"/><circle cx="120" cy="750" r="230" fill="#89b4fa" opacity=".05"/>
  <text class="title" x="800" y="82" text-anchor="middle">One machine. One profile.</text>
  <text class="subtitle" x="800" y="122" text-anchor="middle">Initialization derives the profile instead of asking the machine to cosplay as another one.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="90" y="205" width="350" height="122" rx="24"/><circle cx="146" cy="266" r="24" fill="#f5c2e7"/><text class="label" x="192" y="258">macOS</text><text class="small" x="192" y="289">.chezmoi.os = darwin</text>
    <rect class="card" x="90" y="359" width="350" height="122" rx="24"/><circle cx="146" cy="420" r="24" fill="#89b4fa"/><text class="label" x="192" y="412">Windows</text><text class="small" x="192" y="443">.chezmoi.os = windows</text>
    <rect class="card" x="90" y="513" width="350" height="142" rx="24"/><circle cx="146" cy="576" r="24" fill="#f9e2af"/><text class="label" x="192" y="562">Linux</text><text class="small" x="192" y="593">/etc/os-release</text><text class="mono" x="192" y="624" fill="#f9e2af">ID=arch</text>
  </g>

  <path class="line" d="M440 266H690"/><path class="line" d="M440 420H690"/><path class="line" d="M440 584H690"/>
  <g filter="url(#shadow)">
    <rect x="690" y="205" width="360" height="122" rx="24" fill="#302d41" stroke="#f5c2e7" stroke-width="3"/><text class="small" x="870" y="247" text-anchor="middle">PROFILE</text><text class="mono" x="870" y="286" text-anchor="middle" fill="#f5c2e7">darwin</text>
    <rect x="690" y="359" width="360" height="122" rx="24" fill="#302d41" stroke="#89b4fa" stroke-width="3"/><text class="small" x="870" y="401" text-anchor="middle">PROFILE</text><text class="mono" x="870" y="440" text-anchor="middle" fill="#89b4fa">windows</text>
    <rect x="690" y="523" width="360" height="122" rx="24" fill="#302d41" stroke="#f9e2af" stroke-width="3"/><text class="small" x="870" y="565" text-anchor="middle">PROFILE</text><text class="mono" x="870" y="604" text-anchor="middle" fill="#f9e2af">linux-arch</text>
  </g>

  <path class="line" d="M1050 266H1235"/><path class="line" d="M1050 420H1235"/><path class="line" d="M1050 584H1235"/>
  <g filter="url(#shadow)">
    <rect class="card" x="1235" y="205" width="275" height="440" rx="28"/>
    <text class="label" x="1372" y="268" text-anchor="middle">Owned state</text>
    <rect x="1278" y="307" width="189" height="58" rx="14" fill="#313244"/><text class="small" x="1372" y="344" text-anchor="middle">target routing</text>
    <rect x="1278" y="385" width="189" height="58" rx="14" fill="#313244"/><text class="small" x="1372" y="422" text-anchor="middle">file variants</text>
    <rect x="1278" y="463" width="189" height="58" rx="14" fill="#313244"/><text class="small" x="1372" y="500" text-anchor="middle">package data</text>
    <rect x="1278" y="541" width="189" height="58" rx="14" fill="#313244"/><text class="small" x="1372" y="578" text-anchor="middle">agent rules</text>
  </g>

  <rect x="485" y="707" width="630" height="76" rx="20" fill="#2a2028" stroke="#f38ba8" stroke-width="2"/>
  <text class="mono" x="800" y="754" text-anchor="middle" fill="#f38ba8">unsupported OS or distro -&gt; fail loudly</text>
</svg>
