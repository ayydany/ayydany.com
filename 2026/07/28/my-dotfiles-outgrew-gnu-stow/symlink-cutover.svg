<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chezmoi symlink cutover</title>
  <desc id="desc">A terminal-style before and after comparison showing old GNU Stow symlinks replaced with regular files managed by chezmoi.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e1e2e"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      text{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}.ui{font-family:Inter,system-ui,sans-serif}.muted{fill:#7f849c}.body{fill:#cdd6f4;font-size:23px}.dim{fill:#a6adc8;font-size:21px}.heading{font-size:30px;font-weight:700}.prompt{fill:#a6e3a1}.path{fill:#89b4fa}.removed{fill:#f38ba8}.added{fill:#a6e3a1}
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="#11111b"/>
  <text class="ui" x="800" y="78" text-anchor="middle" fill="#cdd6f4" font-size="48" font-weight="750">The cutover was wonderfully boring</text>
  <text class="ui" x="800" y="118" text-anchor="middle" fill="#a6adc8" font-size="22">Chezmoi replaced the old links at the same paths. No home-directory fireworks.</text>
  <g filter="url(#shadow)">
    <rect x="80" y="170" width="1440" height="650" rx="26" fill="url(#panel)" stroke="#45475a" stroke-width="2"/>
    <rect x="80" y="170" width="1440" height="62" rx="26" fill="#313244"/><rect x="80" y="208" width="1440" height="24" fill="#313244"/>
    <circle cx="126" cy="201" r="10" fill="#f38ba8"/><circle cx="158" cy="201" r="10" fill="#f9e2af"/><circle cx="190" cy="201" r="10" fill="#a6e3a1"/>
    <text x="800" y="209" text-anchor="middle" class="ui" fill="#bac2de" font-size="18">chezmoi apply --dry-run --verbose</text>
  </g>

  <text class="ui heading removed" x="130" y="300">BEFORE: GNU STOW</text>
  <text class="body" x="130" y="352"><tspan class="path">~/.zshrc</tspan><tspan class="muted">  -&gt;  ~/Repos/dotfiles/packages/shared/zsh/.zshrc</tspan></text>
  <text class="body" x="130" y="400"><tspan class="path">~/.config/kitty</tspan><tspan class="muted">  -&gt;  .../arch-kde/kitty</tspan></text>
  <text class="body" x="130" y="448"><tspan class="path">~/.config/nvim</tspan><tspan class="muted">   -&gt;  .../shared/nvim</tspan></text>

  <line x1="130" y1="500" x2="1470" y2="500" stroke="#45475a" stroke-width="2"/>
  <text class="prompt body" x="130" y="558">$ chezmoi apply</text>
  <text class="dim" x="130" y="602"><tspan class="removed">- remove symlink</tspan><tspan dx="58" class="path">~/.zshrc</tspan></text>
  <text class="dim" x="130" y="640"><tspan class="added">+ create file</tspan><tspan dx="78" class="path">~/.zshrc</tspan><tspan dx="26" class="muted">mode 0644</tspan></text>
  <text class="dim" x="130" y="678"><tspan class="removed">- remove symlink</tspan><tspan dx="58" class="path">~/.config/kitty</tspan></text>
  <text class="dim" x="130" y="716"><tspan class="added">+ create directory</tspan><tspan dx="30" class="path">~/.config/kitty</tspan></text>

  <rect x="1115" y="548" width="355" height="174" rx="20" fill="#242436" stroke="#a6e3a1" stroke-width="2"/>
  <text class="ui heading added" x="1292" y="600" text-anchor="middle">AFTER</text>
  <text class="body" x="1150" y="650"><tspan class="added">regular file</tspan><tspan dx="18">~/.zshrc</tspan></text>
  <text class="body" x="1150" y="690"><tspan class="added">managed dir</tspan><tspan dx="32">kitty/</tspan></text>
  <text class="ui" x="800" y="780" text-anchor="middle" fill="#cba6f7" font-size="22">symlink out, regular file in, home directory still standing</text>
</svg>
